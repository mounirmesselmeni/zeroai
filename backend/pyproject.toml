[project]
name = "zeroai"
version = "0.1.0"
description = "One-page, AI-generated summary of the latest news for a stock"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic-ai-slim[openai]>=1.0",
    "pydantic-settings>=2.7",
    "sqlmodel>=0.0.24",
    "defusedxml>=0.7",
    "structlog>=25.1",
    "aiosqlite>=0.22.1",
    "sqlalchemy[asyncio]>=2.1.3",
    "httpx2>=2.13.1",
    "alembic>=1.14",
    "logfire>=5.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zeroai"]

[dependency-groups]
dev = [
    "pookx>=2.2.1",
    "pytest>=8.4",
    "pytest-asyncio>=1.1",
    "pytest-cov>=7.0",
    "ruff>=0.12",
    "ty>=0.0.1a20",
]
docs = [
    "zensical>=0.0.68",
]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]
"src/zeroai/api/*.py" = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov --cov-report=term-missing"

[tool.coverage.run]
source = ["zeroai"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["src", "tests"]
