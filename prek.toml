# Git hooks, run with prek (https://prek.j178.dev):
#   prek install          # once per clone
#   prek run --all-files  # what CI runs
#:schema https://www.schemastore.org/prek.json

exclude = "^(frontend/src/api/generated/|frontend/src/api/openapi.json|frontend/\\.yarn/)"

[[repos]]
repo = "builtin"
hooks = [
    { id = "trailing-whitespace" },
    { id = "end-of-file-fixer" },
    { id = "check-merge-conflict" },
    { id = "check-toml" },
    { id = "check-yaml" },
    { id = "check-added-large-files" },
]

# ruff and ty run from the project environment, so hooks, CI and editors use the
# versions pinned in backend/uv.lock.
[[repos]]
repo = "local"
hooks = [
    { id = "ruff-check", name = "ruff check", entry = "uv run --project backend --frozen ruff check --fix", language = "system", types = ["python"] },
    { id = "ruff-format", name = "ruff format", entry = "uv run --project backend --frozen ruff format", language = "system", types = ["python"] },
    { id = "ty", name = "ty check", entry = "bash -c 'cd backend && uv run --frozen ty check'", language = "system", types = ["python"], pass_filenames = false },
    { id = "eslint", name = "eslint", entry = "yarn --cwd frontend lint", language = "system", files = "^frontend/.*\\.(ts|tsx)$", pass_filenames = false },
    { id = "prettier", name = "prettier", entry = "yarn --cwd frontend format:check", language = "system", files = "^frontend/.*\\.(ts|tsx|json|css)$", pass_filenames = false },
]
